services:
  - type: web
    name: app-hours
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/hours.db
    disk:
      name: data
      mountPath: /var/data
